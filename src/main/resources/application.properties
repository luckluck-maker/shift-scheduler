# Development defaults. Docker Compose brings up MySQL, Artemis and MailHog
spring.application.name=shift-scheduler

spring.datasource.url=jdbc:mysql://localhost:3306/shift_scheduler?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=shiftuser
spring.datasource.password=shiftpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis

# I kept a fallback secret so the project can run smoothly after a clone,
# without anyone having to set up environment variables.
# In a real deployment JWT_SECRET should be set as environment variable and
# fallback should be dropped, to ensure key is secured.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-in-production-min-32-chars}
app.jwt.expiration-minutes=480
# Defaults to false because the browser won't store a Secure cookie over plain
# http://localhost, which would break login while developing. In production this
# should be true (JWT_COOKIE_SECURE=true) so the token only travels over HTTPS.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

logging.level.com.shiftscheduler=DEBUG

timefold.solver.termination.spent-limit=40s
timefold.solver.termination.unimproved-spent-limit=10s
# Timefold fixes its random seed by default, so the same week always solves to the
# exact same roster (this can cause an issue of fairness as the same people will
# be assigned to the same shifts over and over again).
# NON_REPRODUCIBLE varies the seed per run: equally good rosters get rotated
# between, the manager can rebuild for a real alternative, and the shift types
# spread more evenly over time.
timefold.solver.environment-mode=${SOLVER_ENV_MODE:NON_REPRODUCIBLE}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=noreply@shiftscheduler.local
spring.mail.default-encoding=UTF-8

# The address the mails point at. The default is the packaged jar; running
# the client through Vite instead means setting APP_URL to its port.
app.url=${APP_URL:http://localhost:8080}
spring.jms.pub-sub-domain=true

# Constraints stop being accepted this long before the week starts. A new week
# gets this on its own, and the manager can move it or clear it per week.
app.submission.closes-days-before=4
app.submission.closes-at-time=23:59
# How often to look for windows that closed.
app.submission.check-rate-ms=3600000