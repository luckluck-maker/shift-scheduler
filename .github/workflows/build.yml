name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: shift_scheduler
          MYSQL_USER: shiftuser
          MYSQL_PASSWORD: shiftpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      artemis:
        image: apache/activemq-artemis:latest-alpine
        env:
          ARTEMIS_USER: artemis
          ARTEMIS_PASSWORD: artemis
          ANONYMOUS_LOGIN: "false"
        ports:
          - 61616:61616

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # A zip keeps no execute bit, and neither does the index on Windows.
      - run: chmod +x mvnw

      - run: ./mvnw -B package

  # Builds the Docker image and publishes it to the GitHub registry. Only after
  # the tests passed, and only for a push to main, not for a pull request.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: latest for whoever pulls, and the commit for knowing what
      # exactly is in it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
