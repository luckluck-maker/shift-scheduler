name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: shift_scheduler
          MYSQL_USER: shiftuser
          MYSQL_PASSWORD: shiftpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      artemis:
        image: apache/activemq-artemis:latest-alpine
        env:
          ARTEMIS_USER: artemis
          ARTEMIS_PASSWORD: artemis
          ANONYMOUS_LOGIN: "false"
        ports:
          - 61616:61616

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # A zip keeps no execute bit, and neither does the index on Windows.
      - run: chmod +x mvnw

      - run: ./mvnw -B package
