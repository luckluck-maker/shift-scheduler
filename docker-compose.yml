services:

  mailhog:
    image: mailhog/mailhog
    container_name: shift-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  mysql:
    image: mysql:8.4
    container_name: shift-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shift_scheduler
      MYSQL_USER: shiftuser
      MYSQL_PASSWORD: shiftpass
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: shift-artemis
    restart: unless-stopped
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - artemis-data:/var/lib/artemis-instance

volumes:
  mysql-data:
  artemis-data:

