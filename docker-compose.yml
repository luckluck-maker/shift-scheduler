services:

  mailhog:
    image: mailhog/mailhog
    container_name: shift-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  mysql:
    image: mysql:8.4
    container_name: shift-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shift_scheduler
      MYSQL_USER: shiftuser
      MYSQL_PASSWORD: shiftpass
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: shift-artemis
    restart: unless-stopped
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - artemis-data:/var/lib/artemis-instance

  # The app itself, behind a profile so the plain "up" still brings only the
  # three above and the app can run from the IDE. "--profile app" runs the
  # whole thing in containers.
  app:
    profiles: ["app"]
    build: .
    image: ghcr.io/sahar-avraham/shift-scheduler:latest
    container_name: shift-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Inside the compose network the others are reached by service name.
    # JWT_SECRET and APP_URL pass through from the host only when set there.
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/shift_scheduler?serverTimezone=UTC&characterEncoding=UTF-8
      - SPRING_ARTEMIS_BROKER_URL=tcp://artemis:61616
      - MAIL_HOST=mailhog
      - JWT_SECRET
      - APP_URL
    depends_on:
      mysql:
        condition: service_healthy
      artemis:
        condition: service_started
      mailhog:
        condition: service_started

volumes:
  mysql-data:
  artemis-data:

